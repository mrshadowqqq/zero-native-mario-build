name: ZERO Native Mario rev2 runtime link probe

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful PRIVATE guest NDK-compile workflow run (artifact expires after 3 days)'
        required: true
        type: string
        default: '38321699927'

permissions:
  contents: read
  actions: read

jobs:
  arm64-runtime:
    name: Compile native execution core and inspect AArch64 link
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout private workflow configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify repository stays PRIVATE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')"
          test "$private" = true || { echo 'STOP: repository must be private.' >&2; exit 2; }

      - name: Install supported Android SDK and NDK 29
        uses: android-actions/setup-android@v4
      - name: Install Android NDK and compilation utilities
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;29.0.14206865'
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_BIN=$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"

      - name: Download EXISTING private NDK game-code artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUEST_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$GUEST_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 2; }
          mkdir -p "$RUNNER_TEMP/guest-artifact"
          gh run download "$GUEST_RUN_ID" -R "$GITHUB_REPOSITORY" \
             -n zero-rev2-android-ndk-objects -D "$RUNNER_TEMP/guest-artifact"
          test -s "$RUNNER_TEMP/guest-artifact/libzero_rev2_code_NDK_UNLINKED.a"
          echo "CODE_ARCHIVE=$RUNNER_TEMP/guest-artifact/libzero_rev2_code_NDK_UNLINKED.a" >> "$GITHUB_ENV"
          echo '[ZERO] Reused precompiled guest archive; NO shard recompilation.'

      - name: Download PRIVATE RuntimeConfig.h only (no game data)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-input/generated
          gh release download zero-rev2-source-v1 -R "$GITHUB_REPOSITORY" \
            -p 'RuntimeConfig.h' -D "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/RuntimeConfig.h"
          cp "$RUNNER_TEMP/RuntimeConfig.h" native-input/generated/RuntimeConfig.h

      - name: Checkout pinned PUBLIC WiiCompiled execution core
        shell: bash
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin \
            https://github.com/WitherBlitz/NSMB-Wii-Multiplayer-Recompilation.git
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set \
            runtime/include runtime/src runtime/third_party/toml11 aurora-main/include
          git -C upstream fetch --depth 1 origin 69ee62be4a28b14ae69c2a03443e3e376f5c3344
          git -C upstream checkout --detach FETCH_HEAD
          test -f upstream/runtime/include/abi_bridge.h
          test -f upstream/runtime/third_party/toml11/toml.hpp
          test -f upstream/aurora-main/include/dolphin/gx.h

      - name: Apply reviewed Android memfd portability fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_android_memfd.py \
            --repo upstream --out "$RUNNER_TEMP/memfd-review"

      - name: Compile 9 native execution-core files with official Android NDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/runtime-objects out/logs
          srcs=(
            abi_bridge.cpp
            memory.cpp
            guest_flat_memory.cpp
            fpu_helpers.cpp
            ppc_helpers.cpp
            ppc_quantized.cpp
            host_context.cpp
            system_bridge.cpp
            platform/host_platform.cpp
          )
          i=0
          for rel in "${srcs[@]}"; do
            i=$((i+1))
            name="${rel//\//_}"
            name="${name%.cpp}"
            echo "[ZERO] Runtime core $i/${#srcs[@]}: $rel"
            "$NDK_BIN/clang++" --target=aarch64-linux-android30 \
              -std=c++20 -O0 -fPIC -DTARGET_PC -DNOMINMAX \
              -fno-fast-math -ffp-contract=off -fno-slp-vectorize -w -pipe \
              -I "$GITHUB_WORKSPACE/upstream/runtime/include" \
              -I "$GITHUB_WORKSPACE/upstream/runtime/src" \
              -I "$GITHUB_WORKSPACE/upstream/runtime/third_party/toml11" \
              -I "$GITHUB_WORKSPACE/upstream" \
              -I "$GITHUB_WORKSPACE/upstream/aurora-main/include" \
              -I "$GITHUB_WORKSPACE/native-input" \
              -c "upstream/runtime/src/$rel" \
              -o "out/runtime-objects/${name}.o" \
              > "out/logs/${name}.log" 2>&1 || {
                tail -n 100 "out/logs/${name}.log"; exit 1;
              }
          done
          test "$(find out/runtime-objects -type f -name '*.o' | wc -l)" -eq 9
          "$NDK_BIN/llvm-ar" rcs out/libzero_rev2_runtime_core_NDK_UNLINKED.a \
            out/runtime-objects/*.o
          echo 'Compiled 9 native ARM64 runtime-core objects.' | tee out/runtime-report.txt

      - name: Partial-link existing game code and compiled runtime (NOT executable)
        shell: bash
        run: |
          set -euo pipefail
          "$NDK_BIN/ld.lld" -r -o out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o \
            --whole-archive "$CODE_ARCHIVE" \
            out/libzero_rev2_runtime_core_NDK_UNLINKED.a --no-whole-archive
          readelf -h out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o \
            | grep -E 'Class:|Type:|Machine:' | tee -a out/runtime-report.txt
          readelf -h out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o \
            | grep -q 'Machine:.*AArch64'
          readelf -h out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o \
            | grep -q 'Type:.*REL'
          "$NDK_BIN/llvm-nm" -u -P out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o \
            | awk '{print $1}' | LC_ALL=C sort -u > out/unresolved_symbols.txt
          printf 'Remaining undefined symbol names: ' | tee -a out/runtime-report.txt
          wc -l < out/unresolved_symbols.txt | tee -a out/runtime-report.txt
          printf '%s\n' \
            'Partial link only. Missing system/graphics/runtime implementations remain.' \
            'This ELF is NOT an Android shared library or an APK.' \
            'Hook addresses and gameplay have NOT been verified.' \
            >> out/runtime-report.txt
          ls -lh out/*.a out/*.o | tee -a out/runtime-report.txt

      - name: Upload PRIVATE runtime/link diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-rev2-ndk-runtime-link-v18
          path: |
            out/libzero_rev2_runtime_core_NDK_UNLINKED.a
            out/zero_rev2_NDK_PARTIAL_UNRESOLVED.o
            out/runtime-report.txt
            out/unresolved_symbols.txt
            out/logs/*.log
          retention-days: 3
          if-no-files-found: warn
