name: ZERO Native Mario v2.5 Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Private release tag containing libmain.so and libc++_shared.so'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout launcher source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 34 platform and SDK build tools
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'build-tools;35.0.0'

      - name: Gradle 8.7 (no wrapper required)
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Download the private ARM64 input release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p android/native/jniLibs/arm64-v8a
          gh release download "$RELEASE_TAG" -R "$GH_REPO" \
            --pattern 'libmain.so' --pattern 'libc++_shared.so' \
            --dir android/native/jniLibs/arm64-v8a
          ls -lh android/native/jniLibs/arm64-v8a
          test -s android/native/jniLibs/arm64-v8a/libmain.so
          test -s android/native/jniLibs/arm64-v8a/libc++_shared.so

      - name: Validate ARM64 and dependency metadata
        run: |
          set -euo pipefail
          LIB=android/native/jniLibs/arm64-v8a/libmain.so
          readelf -h "$LIB" | grep 'Machine:.*AArch64'
          readelf -d "$LIB" | grep -F 'Shared library: [libz.so]'
          readelf -d "$LIB" | grep -F 'Shared library: [libc++_shared.so]'
          if readelf -d "$LIB" | grep -E 'RPATH|RUNPATH|libz\.so\.1'; then
            echo 'ERROR: unexpected Termux search path or zlib SONAME' >&2
            exit 1
          fi
          readelf --dyn-syms -W "$LIB" | grep -F 'SDL_main' | head -1
          readelf --dyn-syms -W "$LIB" | grep -F 'InitializeDataSections' | head -1

      - name: Optionally download separate game assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p android/native/assets
          mkdir -p "$RUNNER_TEMP/zero-assets"
          if gh release download "$RELEASE_TAG" -R "$GH_REPO" \
               --pattern zero-native-v25-assets.tar.gz \
               --dir "$RUNNER_TEMP/zero-assets"; then
            tar -xzf "$RUNNER_TEMP/zero-assets/zero-native-v25-assets.tar.gz" \
              -C android/native/assets --no-same-owner
            echo 'Optional Android assets were staged.'
          else
            echo 'NOTICE: No additional assets were provided. APK may fail during game startup.'
          fi

      - name: Compile and debug-sign the complete APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK and 16 KiB native-library ZIP alignment
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libmain.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" | tail -5
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Save debug APK for Pixel 10a
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Native-Mario-v25-Android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
