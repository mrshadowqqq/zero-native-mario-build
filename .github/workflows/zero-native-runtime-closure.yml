name: ZERO Native rev2 real runtime provider closure (NOT APK)

on:
  workflow_dispatch:
    inputs:
      v20_run_id:
        description: 'Successful private v2.0 GX combined-object run ID'
        required: true
        type: string
      v21_run_id:
        description: 'Successful private v2.1 Aurora archive run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  strict-link:
    name: Compile missing runtime providers and audit strict ARM64 link
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout private workflow configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce PRIVATE destination before retrieving game-derived objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_V20: ${{ inputs.v20_run_id }}
          SOURCE_V21: ${{ inputs.v21_run_id }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" == true ]] || {
            echo 'STOP: private source artifacts must never be downloaded in a public repository.' >&2
            exit 2
          }
          [[ "$SOURCE_V20" =~ ^[0-9]+$ ]] || exit 2
          [[ "$SOURCE_V21" =~ ^[0-9]+$ ]] || exit 2
          mkdir -p out/logs out/artifacts

      - name: Install Android NDK 29 and native archive tools
        uses: android-actions/setup-android@v4

      - name: Configure NDK and tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zstd python3 binutils
          sdkmanager --install 'ndk;29.0.14206865'
          ndk="$ANDROID_HOME/ndk/29.0.14206865"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android30-clang++"
          test -x "$bin/llvm-nm"
          echo "NDK_BIN=$bin" >> "$GITHUB_ENV"

      - name: Retrieve exact successful v2.0 and v2.1 PRIVATE build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V20: ${{ inputs.v20_run_id }}
          V21: ${{ inputs.v21_run_id }}
        run: |
          set -euo pipefail
          for id in "$V20" "$V21"; do
            conclusion="$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
            [[ "$conclusion" == success ]] || { echo "STOP: run $id was not successful." >&2; exit 3; }
          done
          mkdir -p out/artifacts/v20 out/artifacts/v21
          gh run download "$V20" -R "$GITHUB_REPOSITORY" -n zero-rev2-ndk-gx-sdl-v20 -D out/artifacts/v20
          gh run download "$V21" -R "$GITHUB_REPOSITORY" -n zero-rev2-android-aurora-v21 -D out/artifacts/v21
          test -s out/artifacts/v20/zero_rev2_v20_PARTIAL_UNRESOLVED.o
          test -s out/artifacts/v21/zero_aurora_android_arm64_libs.tar.zst
          test -s out/artifacts/v21/library_bundle.sha256
          want="$(awk '{print $1}' out/artifacts/v21/library_bundle.sha256 | head -1)"
          got="$(sha256sum out/artifacts/v21/zero_aurora_android_arm64_libs.tar.zst | awk '{print $1}')"
          [[ "$want" == "$got" ]] || { echo 'STOP: Aurora archive SHA256 mismatch.' >&2; exit 3; }
          readelf -h out/artifacts/v20/zero_rev2_v20_PARTIAL_UNRESOLVED.o | grep -q 'Machine:.*AArch64'
          echo "v2.0 and v2.1 artifacts downloaded and verified." | tee out/summary.txt

      - name: Unpack full Aurora renderer static-link closure
        run: |
          set -euo pipefail
          mkdir -p out/libs
          tar -I zstd -tf out/artifacts/v21/zero_aurora_android_arm64_libs.tar.zst > out/renderer_members.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' out/renderer_members.txt; then
            echo 'STOP: unsafe archive path' >&2
            exit 4
          fi
          tar -I zstd -xf out/artifacts/v21/zero_aurora_android_arm64_libs.tar.zst -C out/libs
          for name in aurora_core aurora_gx aurora_pad aurora_si aurora_vi aurora_mtx aurora_main; do
            count="$(find out/libs -name "lib${name}.a" -type f | wc -l)"
            [[ "$count" == 1 ]] || { echo "STOP: expected exactly one lib${name}.a" >&2; exit 4; }
          done
          for name in webgpu_dawn SDL3 fmt; do
            count="$(find out/libs -name "lib${name}.a" -type f | wc -l)"
            [[ "$count" == 1 ]] || { echo "STOP: expected exactly one lib${name}.a" >&2; exit 4; }
          done
          find out/libs -type f -name '*.a' -print | LC_ALL=C sort > out/available_libs.txt
          echo "Aurora static archives: $(wc -l < out/available_libs.txt)" | tee -a out/summary.txt
          du -sh out/libs | tee -a out/summary.txt

      - name: Checkout immutable public WiiCompiled runtime and SDL3 headers
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin https://github.com/WitherBlitz/NSMB-Wii-Multiplayer-Recompilation.git
          git -C upstream sparse-checkout init --cone
          git -C upstream sparse-checkout set runtime/src runtime/include runtime/cmake runtime/third_party/toml11 runtime/third_party/pugixml runtime/third_party/cryptopp aurora-main/include
          git -C upstream fetch --depth 1 origin 69ee62be4a28b14ae69c2a03443e3e376f5c3344
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = 69ee62be4a28b14ae69c2a03443e3e376f5c3344
          git init -q sdl
          git -C sdl remote add origin https://github.com/libsdl-org/SDL.git
          git -C sdl sparse-checkout init --cone
          git -C sdl sparse-checkout set include
          git -C sdl fetch --depth 1 origin 5848e584a1b606de26e3dbd1c7e4ecbc34f807a6
          git -C sdl checkout --detach FETCH_HEAD
          test "$(git -C sdl rev-parse HEAD)" = 5848e584a1b606de26e3dbd1c7e4ecbc34f807a6
          test -s sdl/include/SDL3/SDL_events.h
          test -s upstream/runtime/src/main.cpp

      - name: Read only private compile-time RuntimeConfig.h (NO game-memory blobs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p native-input/generated
          gh release download zero-rev2-source-v1 -R "$GITHUB_REPOSITORY" \
            -p RuntimeConfig.h -D "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/RuntimeConfig.h"
          cp "$RUNNER_TEMP/RuntimeConfig.h" native-input/generated/RuntimeConfig.h

      - name: Compile REAL missing Wii runtime providers and optional symbolization fallback
        run: |
          set -euo pipefail
          mkdir -p out/runtime-objects out/logs
          sources=(
            'src/main.cpp'
            'src/fiber_manager.cpp'
            'src/hle/os/os_alarm.cpp'
            'src/hle/vi.cpp'
            'cmake/guest_symbol_table_stub.cpp'
          )
          : > out/runtime_source_status.tsv
          : > out/logs/runtime_compile_failures.txt
          failed=0
          objects=()
          for rel in "${sources[@]}"; do
            label="$(printf '%s' "$rel" | tr '/.' '__')"
            file="upstream/runtime/$rel"
            obj="out/runtime-objects/${label}.o"
            log="out/logs/runtime_${label}.log"
            echo "[ZERO v2.3] Compiling public runtime provider: $rel"
            if "$NDK_BIN/aarch64-linux-android30-clang++" \
                -std=c++20 -O0 -fPIC -DNOMINMAX -DTARGET_PC -DSDL_MAIN_HANDLED \
                -fno-fast-math -ffp-contract=off -fno-slp-vectorize \
                -I "$GITHUB_WORKSPACE/upstream/runtime/include" \
                -I "$GITHUB_WORKSPACE/upstream/runtime/src" \
                -I "$GITHUB_WORKSPACE/upstream/runtime/third_party" \
                -I "$GITHUB_WORKSPACE/upstream/runtime/third_party/toml11" \
                -I "$GITHUB_WORKSPACE/upstream" \
                -I "$GITHUB_WORKSPACE/upstream/aurora-main/include" \
                -I "$GITHUB_WORKSPACE/sdl/include" \
                -I "$GITHUB_WORKSPACE/native-input" \
                -c "$file" -o "$obj" > "$log" 2>&1; then
              printf 'OK\t%s\n' "$rel" | tee -a out/runtime_source_status.tsv
              objects+=("$obj")
            else
              failed=$((failed+1))
              printf 'FAIL\t%s\n' "$rel" | tee -a out/runtime_source_status.tsv
              printf '%s\n' "$rel" >> out/logs/runtime_compile_failures.txt
              grep -m 3 -E 'error:|fatal error:' "$log" || tail -n 20 "$log" || true
            fi
          done
          echo "Runtime provider files compiled: ${#objects[@]}/${#sources[@]}" | tee -a out/summary.txt
          echo "Runtime provider compilation failures: $failed" | tee -a out/summary.txt
          if ((failed)); then
            echo 'STOP: mandatory runtime providers failed to compile; error logs retained.' | tee -a out/summary.txt
            exit 1
          fi
          echo 'No real game-memory data_sections_init.cpp or data blobs have been supplied; those remain mandatory for an actual playable game.' | tee -a out/summary.txt

      - name: Partially link public runtime providers with existing game and GX code
        run: |
          set -euo pipefail
          base=out/artifacts/v20/zero_rev2_v20_PARTIAL_UNRESOLVED.o
          "$NDK_BIN/llvm-nm" -u -P "$base" | awk '{print $1}' | LC_ALL=C sort -u > out/unresolved_before.txt
          mapfile -t objects < <(find out/runtime-objects -type f -name '*.o' | LC_ALL=C sort)
          test "${#objects[@]}" -eq 5
          if ! "$NDK_BIN/ld.lld" -r -o out/zero_rev2_v23_PARTIAL_UNRESOLVED.o \
            "$base" "${objects[@]}" > out/logs/runtime_partial_link.log 2>&1; then
            cat out/logs/runtime_partial_link.log
            echo 'STOP: relocatable provider link failed; no valid combined object.' | tee -a out/summary.txt
            exit 1
          fi
          readelf -h out/zero_rev2_v23_PARTIAL_UNRESOLVED.o | grep -q 'Machine:.*AArch64'
          "$NDK_BIN/llvm-nm" -u -P out/zero_rev2_v23_PARTIAL_UNRESOLVED.o | awk '{print $1}' | LC_ALL=C sort -u > out/unresolved_after.txt
          comm -23 out/unresolved_before.txt out/unresolved_after.txt > out/resolved_from_v20.txt
          comm -13 out/unresolved_before.txt out/unresolved_after.txt > out/new_dependencies.txt
          {
            echo "Unresolved symbol names before: $(wc -l < out/unresolved_before.txt)"
            echo "Unresolved symbol names after: $(wc -l < out/unresolved_after.txt)"
            echo "Previously missing names resolved: $(wc -l < out/resolved_from_v20.txt)"
            echo "New dependencies from real runtime providers: $(wc -l < out/new_dependencies.txt)"
          } | tee -a out/summary.txt

      - name: Attempt strict libmain.so link; do NOT hide missing runtime symbols
        run: |
          set -euo pipefail
          input="out/zero_rev2_v23_PARTIAL_UNRESOLVED.o"
          "$NDK_BIN/llvm-nm" --undefined-only -P "$input" | awk '{print $1}' | LC_ALL=C sort -u > out/unresolved_input.txt
          mapfile -t libs < out/available_libs.txt
          test "${#libs[@]}" -gt 15
          printf '%s\n' 'STRICT LINK: mandatory --no-undefined, -z max-page-size=16384' | tee -a out/summary.txt
          set +e
          "$NDK_BIN/aarch64-linux-android30-clang++" \
            -shared -fPIC -fuse-ld=lld -static-libstdc++ \
            -Wl,-soname,libmain.so \
            -Wl,--no-undefined -Wl,--error-limit=0 -Wl,--no-gc-sections \
            -Wl,-z,max-page-size=16384 \
            -o out/libmain.so "$input" \
            -Wl,--start-group "${libs[@]}" -Wl,--end-group \
            -landroid -llog -ldl -lm -lz -latomic -lvulkan -lEGL -lGLESv2 -lGLESv3 \
            -lOpenSLES -lOpenMAXAL -laaudio -lmediandk -ljnigraphics \
            > out/logs/strict_link.log 2>&1
          link_status=$?
          set -e
          echo "Linker exit code: $link_status" | tee -a out/summary.txt
          if [[ "$link_status" -ne 0 ]]; then
            rm -f out/libmain.so
            grep -E 'undefined symbol:|duplicate symbol:|error:|undefined reference to' out/logs/strict_link.log \
              | LC_ALL=C sort -u > out/link_errors.txt || true
            echo "Unresolved input symbol names: $(wc -l < out/unresolved_input.txt)" | tee -a out/summary.txt
            echo "Distinct linker error lines: $(wc -l < out/link_errors.txt)" | tee -a out/summary.txt
            echo 'STOP: no valid libmain.so produced. Inspect strict_link.log and link_errors.txt.' | tee -a out/summary.txt
            sed -n '1,70p' out/logs/strict_link.log
            exit 1
          fi
          test -s out/libmain.so
          readelf -h out/libmain.so | tee out/elf_header.txt
          readelf -h out/libmain.so | grep -q 'Machine:.*AArch64'
          readelf -h out/libmain.so | grep -q 'Type:.*DYN'
          "$NDK_BIN/llvm-nm" -D --defined-only out/libmain.so > out/exported_symbols.txt
          if ! grep -q 'SDL_main' out/exported_symbols.txt; then
            rm -f out/libmain.so
            echo 'STOP: linked ELF has no SDL_main entrypoint; not a usable product.' | tee -a out/summary.txt
            exit 1
          fi
          sha256sum out/libmain.so > out/libmain.sha256
          echo 'PASS: no-undefined AArch64 libmain.so created; Android packaging and game correctness NOT verified.' | tee -a out/summary.txt

      - name: Retain ONLY diagnostic reports (and libmain.so if strict link is valid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-rev2-android-runtime-closure-v23
          path: |
            out/summary.txt
            out/available_libs.txt
            out/unresolved_input.txt
            out/runtime_source_status.tsv
            out/unresolved_before.txt
            out/unresolved_after.txt
            out/resolved_from_v20.txt
            out/new_dependencies.txt
            out/logs/runtime_*.log
            out/logs/runtime_partial_link.log
            out/link_errors.txt
            out/logs/strict_link.log
            out/elf_header.txt
            out/exported_symbols.txt
            out/libmain.sha256
            out/libmain.so
          retention-days: 3
          if-no-files-found: warn
